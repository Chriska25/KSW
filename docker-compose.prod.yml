services:
  backend:
    build:
      context: .
      dockerfile: ./docker/python/Dockerfile
    restart: always
    environment:
      - POSTGRES_USER=${DB_USERNAME:-studio_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-studio_password}
      - POSTGRES_DB=${DB_DATABASE:-studio_photo}
      - DB_HOST=postgres
      - DB_PORT=5432
      - RUNNING_IN_DOCKER=true
    depends_on:
      - postgres
      - redis
    networks:
      - studio_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://kswstudio.fr}
        NEXT_PUBLIC_API_URL: /api/v1
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://kswstudio.fr}
      - NEXT_PUBLIC_API_URL=/api/v1
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - studio_network

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-studio_photo}
      POSTGRES_USER: ${DB_USERNAME:-studio_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studio_password}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - studio_network

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_prod_data:/data
    networks:
      - studio_network

networks:
  studio_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
