services:
  # -------------------------------------------------------------------
  # Python FastAPI Backend Service
  # -------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: ./docker/python/Dockerfile
    container_name: studio_photography_backend
    restart: unless-stopped
    ports:
      - "8050:8000"
    working_dir: /app
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      # Priorité sur DATABASE_URL du .env : dev Docker = Postgres local (stable, sans dépendance réseau Supabase).
      # Pour Supabase : docker compose -f docker-compose.supabase.yml up -d
      - DATABASE_URL=postgresql://studio_user:studio_password@postgres:5432/studio_photo
      - DB_SSLMODE=prefer
      - POSTGRES_USER=studio_user
      - POSTGRES_PASSWORD=studio_password
      - POSTGRES_DB=studio_photo
      - DB_HOST=postgres
      - DB_PORT=5432
      - RUNNING_IN_DOCKER=true
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - MAILTRAP_API_TOKEN=${MAILTRAP_API_TOKEN:-}
      - MAILTRAP_SANDBOX_ID=${MAILTRAP_SANDBOX_ID:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - GMAIL_USE_API=${GMAIL_USE_API:-}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_FROM=${SMTP_FROM:-}
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    networks:
      - studio_network
    depends_on:
      - postgres
      - redis

  # -------------------------------------------------------------------
  # Web Server Service (Nginx Reverse Proxy for Backend API)
  # -------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: studio_photography_nginx
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - studio_network
    depends_on:
      - backend

  # -------------------------------------------------------------------
  # Frontend Next.js Service (Node 22)
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/node/Dockerfile
    container_name: studio_photography_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=/api/v1
      - BACKEND_INTERNAL_URL=http://backend:8000
      - RUNNING_IN_DOCKER=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # IP réseau explicite si la détection auto échoue (sans :port)
      - ALLOWED_DEV_ORIGINS=10.107.0.63
    networks:
      - studio_network
    command: sh -c "rm -rf .next/cache && npx next dev --webpack -p 3000 -H 0.0.0.0"

  # -------------------------------------------------------------------
  # Database Service (PostgreSQL 17)
  # -------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: studio_photography_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-studio_photo}
      POSTGRES_USER: ${DB_USERNAME:-studio_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studio_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - studio_network

  # -------------------------------------------------------------------
  # Cache & Queue Service (Redis 7)
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: studio_photography_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - studio_network

networks:
  studio_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
