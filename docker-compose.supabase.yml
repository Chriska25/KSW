# Docker Compose — backend + frontend sans PostgreSQL local (base Supabase)
# Usage : docker compose -f docker-compose.supabase.yml up -d
#
# Prérequis dans .env :
#   DATABASE_URL=postgresql://postgres.[ref]:[password]@....pooler.supabase.com:6543/postgres?sslmode=require

services:
  backend:
    build:
      context: .
      dockerfile: ./docker/python/Dockerfile
    container_name: studio_photography_backend
    restart: unless-stopped
    ports:
      - "8050:8000"
    working_dir: /app
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_SSLMODE=${DB_SSLMODE:-require}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-gallery-media}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-supabase}
      - STORAGE_LOCAL_MIRROR=${STORAGE_LOCAL_MIRROR:-false}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUNNING_IN_DOCKER=true
      - MAILTRAP_API_TOKEN=${MAILTRAP_API_TOKEN:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - GMAIL_USE_API=${GMAIL_USE_API:-}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_FROM=${SMTP_FROM:-}
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    networks:
      - studio_network
    depends_on:
      - redis

  nginx:
    image: nginx:1.25-alpine
    container_name: studio_photography_nginx
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - studio_network
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/node/Dockerfile
    container_name: studio_photography_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=/api/v1
      - BACKEND_INTERNAL_URL=http://backend:8000
      - RUNNING_IN_DOCKER=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - ALLOWED_DEV_ORIGINS=10.107.0.63
    networks:
      - studio_network
    command: sh -c "rm -rf .next/cache && npx next dev --webpack -p 3000 -H 0.0.0.0"

  redis:
    image: redis:7-alpine
    container_name: studio_photography_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - studio_network

networks:
  studio_network:
    driver: bridge

volumes:
  redis_data:
    driver: local
